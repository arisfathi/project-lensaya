services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-email:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    command: ["npm", "run", "worker:email"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["workers"]

  worker-analytics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    command: ["npm", "run", "worker:analytics"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["workers"]

  worker-image:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    command: ["npm", "run", "worker:image"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["workers"]

  worker-asset-cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    command: ["npm", "run", "worker:asset-cleanup"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["workers"]

  worker-notification:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    command: ["npm", "run", "worker:notification"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["workers"]

  worker-billing-maintenance:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    command: ["npm", "run", "worker:billing-maintenance"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["workers"]

volumes:
  redisdata:
